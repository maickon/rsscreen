<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="theme-color" content="#0A0A0A" />
  <title>Minhas tabelas e cardápios</title>
  <link rel="icon" href="../assets/img/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/brand.css" />
  <link rel="stylesheet" href="../assets/css/editar.css" />
</head>
<body>
  <header class="ed-top">
    <div class="ed-wrap ed-top-in">
      <span class="logo"><i data-logo></i><span><b>rss</b>creen</span></span>
      <span class="ed-cli" id="edCli"></span>
    </div>
  </header>

  <main class="ed-wrap" id="edMain">
    <div class="ed-empty" id="edMsg">Carregando…</div>

    <!-- ===== LISTAS ===== -->
    <section id="vListas" hidden>
      <div class="ed-head">
        <div><h1>Minhas tabelas e cardápios</h1><p>O que você salvar aqui aparece na TV em até 10 minutos.</p></div>
        <button class="btn btn-primary" id="edNova" type="button"><i data-icon="plus"></i> Nova</button>
      </div>
      <form class="ed-card ed-nova" id="edNovaForm" hidden autocomplete="off">
        <h2>Nova tabela ou cardápio</h2>
        <div class="ed-tipos">
          <label><input type="radio" name="tipo" value="precos" checked><span><b>Tabela de preços</b><small>Açougue, hortifrúti, padaria, mercado</small></span></label>
          <label><input type="radio" name="tipo" value="cardapio"><span><b>Cardápio</b><small>Lanches, pizzas, açaí, cafeteria</small></span></label>
        </div>
        <label class="field"><span>Tipo de comércio (define o visual e o catálogo)</span><select class="select" id="edSeg"></select></label>
        <label class="field"><span>Nome (só para você)</span><input class="input" id="edNome" maxlength="60" placeholder="Ex.: Preços do balcão"></label>
        <div class="ed-acts"><button class="btn btn-primary" type="submit"><i data-icon="check"></i> Criar</button><button class="btn btn-ghost" type="button" id="edNovaCancel">Cancelar</button></div>
      </form>
      <div id="edLista" class="ed-listas"></div>
    </section>

    <!-- ===== EDITOR ===== -->
    <section id="vEditor" hidden>
      <div class="ed-head">
        <div><button class="ed-back" id="edVoltar" type="button">← Minhas listas</button><h1 id="edTitulo"></h1><p id="edResumo"></p></div>
      </div>

      <div class="ed-grid">
        <div class="ed-col">
          <div class="ed-card">
            <h2>Produtos <small id="edConta"></small></h2>
            <div class="ed-busca">
              <input class="input" id="edBusca" placeholder="Buscar no catálogo: picanha, x-salada, banana…" autocomplete="off">
              <div class="ed-res" id="edRes" hidden></div>
            </div>
            <button class="btn btn-ghost btn-sm" id="edProprio" type="button"><i data-icon="plus"></i> Item que não está no catálogo</button>
            <div id="edItens" class="ed-itens"></div>
          </div>
        </div>

        <div class="ed-col">
          <div class="ed-card">
            <h2>Como aparece na TV</h2>
            <div class="ed-pv"><div class="ed-tv"><iframe id="edPv" title="Prévia na TV"></iframe></div></div>
            <div class="ed-row">
              <label class="field"><span>Modelo</span><select class="select" id="edLayout"><option value="lista">Lista com preços</option><option value="cardapio">Cardápio em cartões</option><option value="ofertas">Ofertas em destaque</option></select></label>
              <label class="field"><span>Visual</span><select class="select" id="edTema"></select></label>
            </div>
            <label class="field"><span>Título na TV</span><input class="input" id="edTit" maxlength="60" placeholder="Ex.: Açougue do Zé"></label>
            <label class="field"><span>Faixa abaixo do título</span><input class="input" id="edSub" maxlength="60" placeholder="Ex.: Preços de hoje"></label>
            <label class="field"><span>Rodapé</span><input class="input" id="edRod" maxlength="120" placeholder="Ex.: Encomendas pelo WhatsApp (22) 99999-0000"></label>
            <label class="field"><span>Itens que acabaram</span><select class="select" id="edEsg"><option value="riscar">Mostrar riscados, com "acabou"</option><option value="esconder">Esconder da TV</option></select></label>
          </div>
          <div class="ed-card">
            <h2>Link para a TV</h2>
            <p class="ed-hint">Abra este link na TV, TV Box ou sistema de mídia indoor. Ele não muda quando você edita a lista.</p>
            <code class="ed-link" id="edLink"></code>
            <div class="ed-acts">
              <button class="btn btn-dark btn-sm" type="button" data-cp="horizontal"><i data-icon="copy"></i> Copiar (TV deitada)</button>
              <button class="btn btn-ghost btn-sm" type="button" data-cp="vertical"><i data-icon="copy"></i> Copiar (TV em pé)</button>
            </div>
            <button class="btn btn-ghost btn-sm ed-del" id="edExcluir" type="button"><i data-icon="trash"></i> Excluir esta lista</button>
          </div>
        </div>
      </div>

      <div class="ed-save" id="edSaveBar">
        <span id="edEstado">Tudo salvo</span>
        <button class="btn btn-primary" id="edSalvar" type="button"><i data-icon="check"></i> Salvar</button>
      </div>
    </section>
  </main>

  <datalist id="edUnidades"><option value="kg"><option value="un"><option value="100 g"><option value="maço"><option value="pct"><option value="dúzia"><option value="litro"><option value="porção"><option value="fatia"><option value="bandeja"></datalist>
  <datalist id="edCats"></datalist>
  <div class="toast" id="toast"></div>

  <script src="../config/clientes.js"></script>
  <script src="../assets/js/core.js"></script>
  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/editar.js"></script>
</body>
</html>
